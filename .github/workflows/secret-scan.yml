name: Secret scan in bundle

on:
  pull_request:
  push:
    branches: [ security/* ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build GH Pages bundle
        run: npm run build:gh-pages

      - name: Scan built assets for secrets
        run: |
          npx --yes ripgrep@13.0.0 -n "(?i)(api[_-]?key|secret|token|bearer|authorization|ghp_|sk_live|sk_test|airtable|imgur|discord|facebook|instagram|database_url|session_secret)" dist/ || true
          MATCHES=$(npx --yes ripgrep@13.0.0 -n "(?i)(api[_-]?key|secret|token|bearer|authorization|ghp_|sk_live|sk_test|airtable|imgur|discord|facebook|instagram|database_url|session_secret)" dist/ | wc -l)
          if [ "$MATCHES" -gt 0 ]; then
            echo "Potential secret-like strings found in bundle. Review required." >&2
            exit 1
          fi
